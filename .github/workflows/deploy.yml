name: Test and deploy ChargeScope
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and site smoke tests
        run: |
          node --check app.js
          node --check service-worker.js
          node --test tests/*.test.mjs
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop, Android, iPhone and tablet UI tests
        run: npm run test:ui
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chargescope-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js core.mjs planner.mjs devices.mjs icon.svg manifest.webmanifest service-worker.js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
